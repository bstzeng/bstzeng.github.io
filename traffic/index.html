<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060d">
  <title>塞車模擬器 // NEON LAB</title>
  <meta name="description" content="微觀車流模擬：每一台車都會自己跟車、變換車道、不會互撞。28 種道路情境：合流、車道縮減、事故、施工、交織、苜蓿葉、系統交流道、匝道儀控、號誌路口、圓環等，可調整每個入口的車流。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="traffic.css">
</head>
<body>
  <header class="top">
    <a class="chip" href="../">← 首頁</a>
    <h1><span class="logo">JAM//SIM</span> 塞車模擬器</h1>
    <select id="scSelect" aria-label="選擇道路情境"></select>
  </header>

  <div class="wrap">
    <aside class="list" id="scList" aria-label="道路情境"></aside>

    <main class="stage">
      <canvas id="cv" aria-label="車流模擬畫面"></canvas>
      <div class="toolbar">
        <button class="tb" id="bPlay" title="暫停／繼續">⏸</button>
        <div class="speeds" id="speeds">
          <button data-s="1">1×</button><button data-s="2">2×</button><button data-s="4" class="on">4×</button><button data-s="8">8×</button><button data-s="16">16×</button>
        </div>
        <button class="tb" id="bReset" title="重新開始">↺</button>
        <button class="tb" id="bView" title="全覽／聚焦">⤢</button>
        <button class="tb txt" id="bColor" title="車子顏色">顏色：速度</button>
      </div>
      <div class="clock mono" id="clock">00:00</div>
      <div class="legend" id="legend">
        <span>車速</span><i class="grad"></i><span class="mono">0</span><span class="mono r">100+ km/h</span>
      </div>
      <div class="vinfo" id="vinfo" hidden></div>
      <p class="hint">拖曳移動 · 滾輪／雙指縮放 · 點車子看資訊</p>
    </main>

    <aside class="panel">
      <section class="card">
        <p class="tag mono" id="scGroup"></p>
        <h2 id="scName"></h2>
        <p class="desc" id="scDesc"></p>
      </section>

      <section class="card">
        <h3>調整</h3>
        <div id="controls"></div>
        <div class="ctl-sep"></div>
        <label class="ctl"><span>大型車比例 <b><span id="truckV">10</span>%</b></span><input type="range" id="truck" min="0" max="50" step="1" value="10"></label>
        <label class="ctl"><span>駕駛不穩定程度 <b id="noiseV">中</b></span><input type="range" id="noise" min="0" max="0.6" step="0.05" value="0.15"></label>
      </section>

      <section class="card">
        <h3>模擬結果</h3>
        <div class="stats" id="stats"></div>
        <p class="sub">車速 <i class="dot c"></i> 與 通過量 <i class="dot p"></i>（輛/時）</p>
        <canvas class="chart" id="chart"></canvas>
        <p class="sub">時空圖：主線每一段的車速（紅色 = 塞車，斜斜的紅帶 = 回堵往上游傳）</p>
        <canvas class="heat" id="heat"></canvas>
        <div id="tables"></div>
      </section>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
